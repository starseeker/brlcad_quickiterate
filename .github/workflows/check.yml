name: Make Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: BRL-CAD make check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # X11 and OpenGL support needed for display-related tests
          sudo apt-get install -y xserver-xorg-dev libx11-dev libxi-dev libxext-dev libglu1-mesa-dev libfontconfig-dev
          # Tools required by BRL-CAD build/test
          sudo apt-get install -y astyle re2c xsltproc libxml2-utils
          # System libraries needed by the minimalist BRL-CAD configure
          sudo apt-get install -y libjpeg-dev tcl-dev tk-dev
          # OpenGL and virtual framebuffer for headless display in CI
          sudo apt-get install -y libgl-dev xvfb
          # XCB / input dev packages required by the Qt6 platform plugin on Linux
          # See: https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev \
            libx11-xcb-dev libxfixes-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev \
            libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev
          # Qt6 development packages (Widgets, SVG, Network, OpenGL, OpenGLWidgets)
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-svg-dev \
            qt6-tools-dev \
            libqt6opengl6t64 \
            libqt6openglwidgets6t64
            
      - name: Configure BRL-CAD
        run: |
          cmake -S ${{ github.workspace }}/brlcad \
            -B ${{ github.workspace }}/brlcad_build \
            -DBRLCAD_EXT_DIR=${{ github.workspace }}/bext_output \
            -DBRLCAD_EXTRADOCS=OFF \
            -DBRLCAD_ENABLE_STEP=OFF \
            -DBRLCAD_ENABLE_GDAL=OFF \
            -DBRLCAD_ENABLE_QT=OFF

      - name: Build BRL-CAD
        run: |
          cmake --build ${{ github.workspace }}/brlcad_build -j$(nproc)

      - name: Run make check
        run: |
          xvfb-run --auto-servernum \
            cmake --build ${{ github.workspace }}/brlcad_build --target check
